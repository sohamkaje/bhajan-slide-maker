<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bhajan slides</title>
  <style>
    :root {
      --navy: #071a66;
      --gold: #ffc000;
      --ink: #1c2430;
      --muted: #6e675c;
      --paper: #f4efe6;
      --line: #e3d9c6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", Candara, sans-serif;
      background:
        radial-gradient(900px 280px at 50% -120px, #1a3484 0%, transparent 70%),
        var(--paper);
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 2.6rem 1.2rem 3rem; }
    header h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: normal;
      font-size: 2.15rem;
      letter-spacing: 0.01em;
      color: var(--navy);
    }
    header p { margin: 0.4rem 0 1.3rem; color: var(--muted); }
    .card {
      background: #fffdf8;
      border: 1px solid var(--line);
      border-top: 4px solid var(--gold);
      padding: 1rem;
      box-shadow: 0 16px 40px rgba(7, 26, 102, 0.07);
    }
    .choices { display: flex; gap: 0.75rem; align-items: stretch; }
    .choice {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: #fff;
      padding: 0.85rem;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .choice h2 {
      margin: 0 0 0.55rem;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--navy);
    }
    .or {
      align-self: center;
      color: #b8860b;
      font-family: Georgia, serif;
      font-style: italic;
    }
    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid #ddd4c4;
      background: #fffefb;
      color: var(--ink);
      padding: 0.55rem 0.6rem;
      font: 15px/1.45 Consolas, "Courier New", monospace;
    }
    textarea { height: 190px; resize: vertical; }
    input[type="text"] { font-family: "Segoe UI", Candara, sans-serif; font-size: 16px; }
    .file-box {
      height: 190px;
      border: 1px dashed #c9b27a;
      background: #fffaf0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      padding: 0.8rem;
    }
    .file-box strong { color: var(--navy); font-weight: 650; }
    .file-box input { display: none; }
    .choice.is-off { opacity: 0.42; background: #f3f0ea; pointer-events: none; }
    .choice.is-off textarea,
    .choice.is-off .file-box { cursor: not-allowed; background: #eeeae3; }
    .name { display: block; margin-top: 0.95rem; }
    .name span, .file-name {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--navy);
    }
    .file-name { margin: 0; letter-spacing: 0.02em; text-transform: none; font-size: 0.95rem; }
    .actions { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.9rem; }
    button, .btn {
      font: 15px "Segoe UI", Candara, sans-serif;
      padding: 0.55rem 0.95rem;
      cursor: pointer;
      background: var(--navy);
      color: #fff;
      border: 1px solid var(--navy);
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .btn:hover { background: #10257f; }
    button.secondary, .text-btn {
      background: transparent;
      color: var(--navy);
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .hidden { display: none; }
    #status { min-height: 1.3rem; margin: 0.7rem 0 0; }
    .error { color: #8d1d1d; }
    #result { margin-top: 1.2rem; }
    .slide { background: #071a66; color: #fff; padding: 1.1rem 1.2rem 0.8rem; margin: 0 0 0.8rem; }
    .slide h2 { color: var(--gold); font-size: 1.35rem; margin: 0 0 0.7rem; font-weight: bold; letter-spacing: 0; text-transform: none; }
    .slide p { margin: 0.25rem 0; font-size: 1.05rem; }
    .slide .meaning { color: #d2d2d2; font-style: italic; font-size: 0.95rem; margin-top: 0.8rem; }
    .slide .next { text-align: right; margin-top: 0.9rem; color: var(--gold); font-size: 0.9rem; }
    .slide .next span { color: #d2d2d2; }
    .slide.center { text-align: center; }
    .slide.center .body { font-size: 1.5rem; padding: 2.2rem 0; }
    @media (max-width: 520px) {
      .choices { flex-direction: column; }
      .or { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bhajan slides</h1>
      <p>One list, in the order you write it. Paste the names or upload a .txt file.</p>
    </header>
    <form id="form">
      <div class="card">
        <div class="choices">
          <section class="choice" id="paste-choice">
            <h2>Paste the list</h2>
            <textarea name="list" placeholder="Gowri Ganesha Vinayaka&#10;Deena Natha Sai Guru Natha"></textarea>
          </section>
          <div class="or">or</div>
          <section class="choice" id="file-choice">
            <h2>Upload a .txt file</h2>
            <label class="file-box">
              <input type="file" name="file" accept=".txt,text/plain">
              <strong>Choose a text file</strong>
              <span id="file-hint">One bhajan name on each line.</span>
            </label>
            <p id="file-name" class="file-name hidden"></p>
            <button type="button" class="text-btn hidden" id="clear-file">Remove file</button>
          </section>
        </div>
        <label class="name">
          <span>PowerPoint file name</span>
          <input type="text" name="filename" placeholder="Saturday session.pptx">
        </label>
      </div>
      <div class="actions">
        <button type="submit" id="make">Make slides</button>
      </div>
      <p id="status"></p>
    </form>
    <div id="result" class="hidden">
      <p id="summary"></p>
      <p>
        <a id="download" class="btn" href="#">Download pptx</a>
        <button type="button" class="secondary" id="preview-btn">Preview</button>
      </p>
      <div id="preview" class="hidden"></div>
    </div>
  </div>
  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const preview = document.getElementById("preview");
    const make = document.getElementById("make");
    const list = form.elements.list;
    const file = form.elements.file;
    const pasteChoice = document.getElementById("paste-choice");
    const fileChoice = document.getElementById("file-choice");
    const fileName = document.getElementById("file-name");
    const clearFile = document.getElementById("clear-file");
    let slidesData = [];
    let pptxFile = "";
    let pptxName = "bhajans.pptx";

    function syncChoice() {
      const hasText = list.value.trim().length > 0;
      const hasFile = file.files && file.files.length > 0;
      list.disabled = hasFile;
      file.disabled = hasText;
      pasteChoice.classList.toggle("is-off", hasFile);
      fileChoice.classList.toggle("is-off", hasText);
      if (hasFile) {
        fileName.textContent = file.files[0].name;
        fileName.classList.remove("hidden");
        clearFile.classList.remove("hidden");
      } else {
        fileName.textContent = "";
        fileName.classList.add("hidden");
        clearFile.classList.add("hidden");
      }
    }

    list.addEventListener("input", syncChoice);
    file.addEventListener("change", function () {
      const chosen = file.files && file.files[0];
      if (chosen && !chosen.name.toLowerCase().endsWith(".txt")) {
        file.value = "";
        status.textContent = "Upload a .txt file.";
        status.className = "error";
      } else if (status.className === "error" && status.textContent === "Upload a .txt file.") {
        status.textContent = "";
        status.className = "";
      }
      syncChoice();
    });
    clearFile.addEventListener("click", function () {
      file.value = "";
      syncChoice();
    });

    function line(parent, className, text) {
      const node = document.createElement("p");
      if (className) node.className = className;
      node.textContent = text;
      parent.appendChild(node);
    }

    function showPreview(slides) {
      preview.replaceChildren();
      slides.forEach(function (slide) {
        const card = document.createElement("article");
        card.className = slide.center ? "slide center" : "slide";
        const heading = document.createElement("h2");
        heading.textContent = slide.title;
        card.appendChild(heading);
        if (slide.center) {
          const body = document.createElement("div");
          body.className = "body";
          body.textContent = (slide.lines || []).join(" ");
          card.appendChild(body);
        } else {
          (slide.lines || []).forEach(function (item) { line(card, "", item); });
          if (slide.meaning) line(card, "meaning", slide.meaning);
        }
        if (slide.next) {
          const next = document.createElement("p");
          next.className = "next";
          const label = document.createElement("span");
          label.textContent = "Next: ";
          next.appendChild(label);
          next.appendChild(document.createTextNode(slide.next));
          card.appendChild(next);
        }
        preview.appendChild(card);
      });
      preview.classList.remove("hidden");
    }

    document.getElementById("download").addEventListener("click", function (event) {
      if (!pptxFile) return;
      event.preventDefault();
      const binary = atob(pptxFile);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], {type: "application/vnd.openxmlformats-officedocument.presentationml.presentation"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = pptxName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    document.getElementById("preview-btn").addEventListener("click", function () {
      if (!slidesData.length) return;
      if (preview.classList.contains("hidden")) {
        showPreview(slidesData);
        this.textContent = "Hide preview";
      } else {
        preview.classList.add("hidden");
        this.textContent = "Preview";
      }
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const hasText = list.value.trim().length > 0;
      const hasFile = file.files && file.files.length > 0;
      if (hasText === hasFile) {
        status.textContent = hasText
          ? "Use either a pasted list or a text file."
          : "Paste a list or choose a .txt file.";
        status.className = "error";
        return;
      }
      status.textContent = "Searching Sai Rhythms and building the slides. This can take a minute.";
      status.className = "";
      result.classList.add("hidden");
      preview.classList.add("hidden");
      make.disabled = true;
      try {
        const response = await fetch("/generate", { method: "POST", body: new FormData(form) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not make the slides.");
        status.textContent = "";
        document.getElementById("summary").textContent =
          "Lyrics found for " + data.found + " of " + data.total + ". File: " + data.filename;
        const download = document.getElementById("download");
        download.href = "/download/" + data.token;
        download.setAttribute("download", data.filename);
        pptxFile = data.pptx || "";
        pptxName = data.filename || "bhajans.pptx";
        slidesData = data.slides || [];
        result.classList.remove("hidden");
        document.getElementById("preview-btn").textContent = "Preview";
      } catch (error) {
        status.textContent = error.message;
        status.className = "error";
      } finally {
        make.disabled = false;
      }
    });
  </script>
</body>
</html>
